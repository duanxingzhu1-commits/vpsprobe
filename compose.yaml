services:
  hub:
    build: .
    env_file: .env
    environment:
      VPSPROBE_HOST: "0.0.0.0"
      VPSPROBE_PORT: "8765"
      VPSPROBE_DB: /data/vpsprobe.db
      VPSPROBE_PUBLIC_HTTPS: "1"
    volumes:
      - hub_data:/data
    expose:
      - "8765"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    environment:
      VPSPROBE_DOMAIN: ${VPSPROBE_DOMAIN:?Set VPSPROBE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      hub:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hub_data:
  caddy_data:
  caddy_config:

