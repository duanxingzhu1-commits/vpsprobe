<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VPSProbe · 服务器监控</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e9edf6;background:#0b1020;font-size:14px}
*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}a{color:inherit}
.shell{display:grid;grid-template-columns:216px 1fr;min-height:100vh}.side{background:#0e1528;border-right:1px solid #22304b;padding:28px 17px;display:flex;flex-direction:column}.brand{font-weight:800;font-size:21px;letter-spacing:-.8px;padding:0 11px 35px}.brand span{color:#5ee6ca}.nav{display:block;padding:12px 14px;border-radius:9px;color:#92a0b8;margin:3px 0;text-decoration:none}.nav.active{color:#dffff9;background:#183a44}.side-foot{margin-top:auto;color:#6e7b95;font-size:12px;padding:12px}.main{max-width:1500px;width:100%;margin:auto;padding:34px 40px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.eyebrow{color:#6bdfc7;text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:800}.top h1{margin:7px 0 6px;font-size:30px;letter-spacing:-1px}.sub{color:#8e9ab1}.actions{display:flex;gap:10px;align-items:center}.btn{border:1px solid #33415b;background:#17233b;color:#e7eefb;border-radius:9px;padding:10px 15px;font-weight:650}.btn.primary{background:#50dfbf;color:#082322;border-color:#50dfbf}.btn:hover{filter:brightness(1.12)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:30px 0}.stat{background:#121c30;border:1px solid #26344d;border-radius:13px;padding:21px}.stat .label{color:#94a4bd;font-size:12px}.stat .value{font-size:29px;font-weight:760;margin:11px 0 4px}.stat .meta{color:#74839c;font-size:12px}.green{color:#59dfbf}.amber{color:#f5bf70}.red{color:#fa7d83}.split{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(290px,.95fr);gap:18px}.panel{background:#121c30;border:1px solid #26344d;border-radius:13px;overflow:hidden}.panel-head{padding:20px 22px;border-bottom:1px solid #26344d;display:flex;align-items:center;justify-content:space-between}.panel h2{font-size:16px;margin:0}.hint{color:#8796ad;font-size:12px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th{text-align:left;color:#7e8ea8;font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:700;padding:15px 20px}td{padding:18px 20px;border-top:1px solid #26344d;color:#d8e1f0}tbody tr:hover{background:#18263e}.server-name{font-weight:730}.server-sub{font-size:11px;color:#8392a9;margin-top:4px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#57dfbd;margin-right:8px}.dot.off{background:#f27f81}.pill{display:inline-block;border:1px solid #38536c;border-radius:20px;padding:5px 9px;color:#aac3d9;font-size:11px}.usage{width:95px;background:#2a3953;border-radius:10px;height:6px;display:inline-block;margin-right:8px;vertical-align:middle}.usage i{display:block;background:#58d9bd;height:100%;border-radius:10px}.tiny{font-size:11px;color:#8898b1}.text-btn{background:transparent;border:none;color:#76e6d0;padding:0;font-weight:700}.events{padding:4px 19px}.event{display:flex;gap:13px;padding:17px 2px;border-bottom:1px solid #26344d}.event:last-child{border:0}.event-mark{width:25px;height:25px;border-radius:7px;background:#334e4d;color:#5ee6c8;text-align:center;line-height:25px;flex:none}.event-mark.warning{background:#4b3d35;color:#ffc078}.event-body{min-width:0;line-height:1.45}.event-body b{font-size:12px}.event-body p{margin:4px 0 0;color:#8a9ab2;font-size:12px}.empty{padding:40px;text-align:center;color:#8c9bb1}.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0%,#182941,#0b1020 55%)}.login-card{width:min(380px,90vw);background:#121c30;border:1px solid #26344d;border-radius:16px;padding:30px}.login-card h1{margin:0 0 6px}.login-card p{color:#8b9bb2;margin:0 0 24px}.field{display:block;color:#a6b5c9;font-size:12px;margin:14px 0 7px}.input{width:100%;background:#0c1526;color:#edf4ff;border:1px solid #33425e;border-radius:8px;padding:11px;outline:none}.input:focus{border-color:#59dbbf}.modal-bg{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px}.modal{background:#121c30;border:1px solid #31425f;border-radius:14px;padding:25px;width:min(480px,100%);max-height:90vh;overflow:auto}.modal h2{margin:0 0 17px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.code{display:block;background:#0b1424;border:1px solid #30415c;border-radius:8px;padding:13px;word-break:break-all;color:#72eccd;margin:14px 0}.notice{color:#9cafc5;line-height:1.6}.error{color:#f8898b;margin:10px 0}.detail{padding:20px 23px}.detail-line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #26344d}.detail-line span:first-child{color:#8999b1}.foot{margin-top:27px;color:#697b96;font-size:11px}
@media(max-width:1100px){.shell{display:block}.grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.side{display:none}.main{padding:24px}}
@media(max-width:600px){.main{padding:19px 13px}.top{align-items:flex-start}.top h1{font-size:25px}.actions{flex-direction:column;align-items:stretch}.grid{gap:9px;margin:22px 0}.stat{padding:14px}.stat .value{font-size:23px}.panel-head{padding:16px}.row{grid-template-columns:1fr}}
.view-tabs{display:flex;gap:8px;margin:22px 0 0}.view-tabs button{border:1px solid #30415a;background:#142139;color:#aab9cf;border-radius:8px;padding:9px 13px}.view-tabs button.active{background:#183d46;color:#72e8ce;border-color:#37736e}.server-cards{display:none}.server-card{padding:17px;border-top:1px solid #26344d}.server-card-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px}.server-card-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;color:#9badc3;font-size:12px}.server-card-grid strong{display:block;color:#e8eef9;font-size:13px;margin-top:4px}.server-card .text-btn{margin-top:16px}.full-view .split{display:block}.full-view #servers,.full-view #events{width:100%}
@media(max-width:700px){.top{display:block}.actions{flex-direction:row;margin-top:16px}.actions .btn{flex:1}.table-wrap{display:none}.server-cards{display:block}.view-tabs{overflow:auto;white-space:nowrap}.view-tabs button{flex:none}}
</style>
</head>
<body><div id="app"></div>
<script>
let servers=[],events=[],now=0,selected=null;
let view='overview';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtBytes=n=>n==null?'—':n>=1073741824?(n/1073741824).toFixed(1)+' GB':n>=1048576?(n/1048576).toFixed(1)+' MB':(n/1024).toFixed(0)+' KB';
const online=s=>s.last_seen&&now-s.last_seen<=90;
const days=s=>s.expires_at?Math.ceil((new Date(s.expires_at+'T23:59:59Z').getTime()-Date.now())/86400000):null;
async function api(path,method='GET',body){let r=await fetch(path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let j=await r.json();if(!r.ok)throw Error(j.error||'请求失败');return j}
function login(){app.innerHTML=`<div class="login"><form class="login-card" id="login"><div class="brand" style="padding:0 0 20px">VPS<span>Probe</span></div><h1>欢迎回来</h1><p>登录你的服务器监控面板</p><label class="field">管理密码</label><input class="input" type="password" name="password" required autofocus><div id="login-error" class="error"></div><button class="btn primary" style="width:100%">进入面板</button></form></div>`;$('#login').onsubmit=async e=>{e.preventDefault();try{await api('/api/login','POST',{password:e.target.password.value});await load()}catch(x){$('#login-error').textContent=x.message}}}
function render(){let on=servers.filter(online).length;let exp=servers.filter(s=>days(s)!==null&&days(s)<=30).length;let high=servers.filter(s=>s.quota_gb&&s.used_bytes/(s.quota_gb*1073741824)>=.8).length;
app.innerHTML=`<div class="shell"><aside class="side"><div class="brand">VPS<span>Probe</span></div><a class="nav active" href="#">总览面板</a><a class="nav" href="#servers">服务器列表</a><a class="nav" href="#events">事件记录</a><div class="side-foot">自托管服务器监控 · 第一版</div></aside><main class="main"><div class="top"><div><div class="eyebrow">Operations Overview</div><h1>服务器总览</h1><div class="sub">集中查看运行状态、网络连接、流量与到期时间</div></div><div class="actions"><button class="btn" onclick="load()">刷新数据</button><button class="btn primary" onclick="enroll()">+ 添加服务器</button></div></div><section class="grid"><div class="stat"><div class="label">服务器总数</div><div class="value">${servers.length}</div><div class="meta">已接入面板</div></div><div class="stat"><div class="label">在线服务器</div><div class="value green">${on}</div><div class="meta">${servers.length-on} 台离线</div></div><div class="stat"><div class="label">30 天内到期</div><div class="value ${exp?'amber':''}">${exp}</div><div class="meta">及时安排续费</div></div><div class="stat"><div class="label">流量超过 80%</div><div class="value ${high?'amber':''}">${high}</div><div class="meta">本期套餐使用情况</div></div></section><div class="split"><section class="panel" id="servers"><div class="panel-head"><h2>服务器</h2><span class="hint">每 30 秒自动更新</span></div><div class="table-wrap"><table><thead><tr><th>服务器</th><th>状态</th><th>CPU / 内存</th><th>本期流量</th><th>到期</th><th></th></tr></thead><tbody>${servers.map(s=>{let pct=s.quota_gb?Math.min(100,s.used_bytes/(s.quota_gb*1073741824)*100):0;let d=days(s);return `<tr><td><div class="server-name">${esc(s.name)}</div><div class="server-sub">${esc(s.region||s.provider||s.os_info||'未填写地区')}</div></td><td><span class="dot ${online(s)?'':'off'}"></span>${online(s)?'在线':'离线'}</td><td>${s.cpu==null?'—':s.cpu.toFixed(0)+'%'} <span class="tiny">/ ${s.memory==null?'—':s.memory.toFixed(0)+'%'}</span></td><td><span class="usage"><i style="width:${pct}%"></i></span><span class="tiny">${fmtBytes(s.used_bytes)}${s.quota_gb?' / '+s.quota_gb+' GB':''}</span></td><td><span class="${d!==null&&d<=7?'amber':''}">${d===null?'未设置':d<0?'已到期':d+' 天'}</span></td><td><button class="text-btn" onclick="detail(${s.id})">详情</button></td></tr>`}).join('')}</tbody></table>${servers.length?'':'<div class="empty">尚未添加服务器。点击右上角“添加服务器”开始连接。</div>'}</div></section><section class="panel" id="events"><div class="panel-head"><h2>最近事件</h2><span class="hint">最新 60 条</span></div><div class="events">${events.length?events.slice(0,8).map(e=>`<div class="event"><div class="event-mark ${e.level==='warning'?'warning':''}">${e.level==='warning'?'!':'✓'}</div><div class="event-body"><b>${esc(e.message.replace(/\s*\[expiry:[^\]]+\]/,''))}</b><p>${new Date(e.ts*1000).toLocaleString('zh-CN')}</p></div></div>`).join(''):'<div class="empty">暂无事件</div>'}</div></section></div><div class="foot">VPSProbe MVP · Linux Agent · Telegram / 企业微信通知通过服务端环境变量配置</div></main></div>`}
function modal(html){let el=document.createElement('div');el.className='modal-bg';el.innerHTML=`<div class="modal">${html}</div>`;el.onclick=e=>{if(e.target===el)el.remove()};document.body.append(el);return el}
async function enroll(){try{let x=await api('/api/enroll','POST',{});let el=modal(`<h2>添加服务器</h2><p class="notice">绑定码有效期 10 分钟，仅可使用一次。将项目文件复制到 VPS 后运行 <code>sudo bash vpsprobe.sh</code>，选择“安装并连接本机 Agent”。</p><label class="field">一次性绑定码</label><code class="code">${esc(x.code)}</code><p class="notice">面板地址：<code>${esc(location.origin)}</code><br>远程接入请先为面板配置 HTTPS 域名。</p><div class="modal-actions"><button class="btn primary" onclick="this.closest('.modal-bg').remove()">完成</button></div>`)}catch(e){alert(e.message)}}
function detail(id){let s=servers.find(x=>x.id===id);if(!s)return;selected=s;let d=days(s);modal(`<h2>${esc(s.name)}</h2><div class="detail"><div class="detail-line"><span>状态</span><b>${online(s)?'在线':'离线'}</b></div><div class="detail-line"><span>网络探测</span><b>${s.probe_ok==null?'暂无数据':s.probe_ok?'正常':'失败'}${s.latency_ms!=null?' · '+s.latency_ms+' ms':''}</b></div><div class="detail-line"><span>CPU / 内存 / 磁盘</span><b>${s.cpu??'—'}% / ${s.memory??'—'}% / ${s.disk??'—'}%</b></div><div class="detail-line"><span>下载 / 上传速率</span><b>${fmtBytes(s.rx_rate)}/s · ${fmtBytes(s.tx_rate)}/s</b></div><div class="detail-line"><span>本期流量</span><b>${fmtBytes(s.used_bytes)}${s.quota_gb?' / '+s.quota_gb+' GB':''}</b></div><div class="detail-line"><span>到期时间</span><b>${s.expires_at||'未设置'}${d!==null?'（'+d+' 天）':''}</b></div></div><form id="edit"><label class="field">机器名称</label><input class="input" name="name" required value="${esc(s.name)}"><div class="row"><div><label class="field">地区</label><input class="input" name="region" value="${esc(s.region)}"></div><div><label class="field">服务商</label><input class="input" name="provider" value="${esc(s.provider)}"></div></div><div class="row"><div><label class="field">到期日期</label><input class="input" type="date" name="expires_at" value="${esc(s.expires_at)}"></div><div><label class="field">月流量额度 (GB)</label><input class="input" type="number" step="0.1" min="0" name="quota_gb" value="${s.quota_gb??''}"></div></div><label class="field">每月账期开始日 (1–28)</label><input class="input" type="number" min="1" max="28" name="billing_day" value="${s.billing_day||1}"><div id="edit-error" class="error"></div><div class="modal-actions"><button type="button" class="btn" onclick="this.closest('.modal-bg').remove()">取消</button><button class="btn primary">保存资料</button></div></form>`);$('#edit').onsubmit=async e=>{e.preventDefault();let f=e.target.elements;try{await api('/api/server/update','POST',{id,name:f.namedItem('name').value,region:f.namedItem('region').value,provider:f.namedItem('provider').value,expires_at:f.namedItem('expires_at').value,quota_gb:f.namedItem('quota_gb').value,billing_day:f.namedItem('billing_day').value});$('.modal-bg').remove();load()}catch(x){$('#edit-error').textContent=x.message}}}
function setView(next){view=next;enhance()}
function enhance(){
  let main=$('.main');if(!main)return;
  let tabs=document.createElement('div');tabs.className='view-tabs';tabs.innerHTML=[['overview','总览'],['servers','服务器'],['events','事件记录']].map(([key,label])=>`<button class="${view===key?'active':''}" data-view="${key}">${label}</button>`).join('');
  let old=$('.view-tabs');if(old)old.remove();$('.top').after(tabs);
  tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
  document.querySelectorAll('.nav').forEach((a,i)=>{a.classList.toggle('active',['overview','servers','events'][i]===view);a.onclick=e=>{e.preventDefault();setView(['overview','servers','events'][i])}});
  let cards=$('.server-cards');if(!cards){cards=document.createElement('div');cards.className='server-cards';$('#servers').append(cards)}
  cards.innerHTML=servers.map(s=>{let d=days(s);return `<article class="server-card"><div class="server-card-head"><div><b>${esc(s.name)}</b><div class="server-sub">${esc(s.region||s.provider||'未填写地区')}</div></div><div><span class="dot ${online(s)?'':'off'}"></span>${online(s)?'在线':'离线'}</div></div><div class="server-card-grid"><div>CPU / 内存<strong>${s.cpu??'—'}% / ${s.memory??'—'}%</strong></div><div>网络探测<strong>${s.probe_ok==null?'暂无数据':s.probe_ok?'正常':'失败'}${s.latency_ms!=null?' · '+s.latency_ms+' ms':''}</strong></div><div>本期流量<strong>${fmtBytes(s.used_bytes)}${s.quota_gb?' / '+s.quota_gb+' GB':''}</strong></div><div>到期<strong>${d===null?'未设置':d<0?'已到期':d+' 天'}</strong></div></div><button class="text-btn" onclick="detail(${s.id})">查看详情与编辑 →</button></article>`}).join('');
  main.classList.toggle('full-view',view!=='overview');main.querySelector('.grid').style.display=view==='overview'?'':'none';
  $('#servers').style.display=view==='events'?'none':'';$('#events').style.display=view==='servers'?'none':'';
  $('.top h1').textContent={overview:'服务器总览',servers:'服务器列表',events:'事件记录'}[view];
  $('.top .sub').textContent={overview:'集中查看运行状态、网络连接、流量与到期时间',servers:'逐台查看资源、网络与套餐信息',events:'查看故障、恢复、流量和到期提醒'}[view];
  if(view==='events'){$('#events h2').textContent='全部事件';$('#events .events').innerHTML=events.map(e=>`<div class="event"><div class="event-mark ${e.level==='warning'?'warning':''}">${e.level==='warning'?'!':'✓'}</div><div class="event-body"><b>${esc(e.message.replace(/\s*\[expiry:[^\]]+\]/,''))}</b><p>${esc(e.kind)} · ${new Date(e.ts*1000).toLocaleString('zh-CN')}</p></div></div>`).join('')||'<div class="empty">暂无事件</div>'}
}
async function load(){try{let [a,b]=await Promise.all([api('/api/servers'),api('/api/events')]);servers=a.servers;now=a.now;events=b.events;render();enhance()}catch(e){if(e.message==='login required')login();else alert(e.message)}}
load();setInterval(()=>{if(!document.querySelector('.modal-bg'))load()},30000);
</script></body></html>
